[project]
name = "polreps"
version = "0.1.0"
description = "Does user-identity scaffolding displace Gemma-3-12B-IT activations along an interpretable ideology direction?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets==5.0.1",
    "huggingface-hub==1.28.0",
    "matplotlib==3.11.1",
    "numpy==2.5.2",
    "python-dotenv==1.2.3",
    "scikit-learn==1.9.0",
    "sentence-transformers==6.0.0",
    "torch==2.13.0",
    "transformer-lens==3.8.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polreps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# slow = needs network or the real model; excluded by default, run with `uv run pytest -m slow`
addopts = "-m 'not slow'"
markers = [
    "slow: needs network or the real model (deselected by default)",
]
